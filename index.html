<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nome Turbo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 14px;
  min-height: 100vh;
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
}

.caixa {
  max-width: 440px;
  margin: 20px auto;
  padding: 24px;
  border: 1px solid #39365d;
  border-radius: 20px;
  background: #171b32;
  box-shadow: 0 0 25px #7c3aed20;
}

h1 {
  color: #a78bfa;
  font-size: 34px;
  margin-bottom: 8px;
}

.subtitulo {
  color: #cbd5e1;
  margin-bottom: 24px;
}

label {
  display: block;
  text-align: left;
  margin: 18px 0 8px;
  font-weight: bold;
}

input, select, button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  font-size: 16px;
}

input, select {
  border: 1px solid #4b5070;
  background: #0f1428;
  color: white;
}

button {
  border: none;
  margin-top: 12px;
  background: #8b5cf6;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

.resultado {
  margin-top: 22px;
  text-align: left;
}

.nome {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  background: #252b46;
  overflow-wrap: anywhere;
}

.nome span {
  font-weight: bold;
  overflow-wrap: anywhere;
}

.nome button {
  width: auto;
  flex-shrink: 0;
  margin: 0;
  padding: 9px 12px;
  font-size: 13px;
  background: #414866;
}

#mensagem {
  color: #c4b5fd;
  font-size: 14px;
  margin-top: 14px;
}

.rodape {
  color: #94a3b8;
  font-size: 12px;
  margin-top: 24px;
}
</style>
</head>

<body>
<main class="caixa">
  <h1>⚡ Nome Turbo</h1>
  <p class="subtitulo">
    Crie nomes incríveis em segundos!
  </p>

  <label for="palavra">Digite uma palavra</label>
  <input
    id="palavra"
    type="text"
    maxlength="20"
    placeholder="Ex.: Dragon"
    autocomplete="off"
  >

  <label for="estilo">Escolha seu estilo</label>
  <select id="estilo">
    <option value="gamer">🎮 Gamer</option>
    <option value="sombrio">👻 Sombrio</option>
    <option value="futurista">🤖 Futurista</option>
    <option value="engracado">😂 Engraçado</option>
  </select>

  <button id="gerar">⚡ GERAR MEUS NOMES</button>

  <section
    id="resultado"
    class="resultado"
    aria-live="polite"
  ></section>

  <p id="mensagem" aria-live="polite"></p>

  <p class="rodape">
    Nome Turbo — sua criatividade, suas regras.
  </p>
</main>

<script>
const finais = {
  gamer: [
    "X", "Pro", "Play", "Gamer", "BR",
    "XP", "Master", "Fire", "Strike", "Legend"
  ],
  sombrio: [
    "Dark", "Shadow", "Ghost", "Night",
    "Phantom", "Raven", "Void", "Dusk"
  ],
  futurista: [
    "Neo", "Cyber", "Quantum", "Nova",
    "Hyper", "Pixel", "Nexus", "Volt"
  ],
  engracado: [
    "Pudim", "Pato", "Turbo", "Miojo",
    "Batata", "Banana", "Pipoca", "Doido"
  ]
};

function misturar(lista) {
  const copia = [...lista];

  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }

  return copia;
}

function criarNomes(palavra, estilo) {
  const base = palavra.trim();
  const extras = finais[estilo];

  let combinacoes = [];

  extras.forEach(extra => {
    combinacoes.push(base + extra);
    combinacoes.push(extra + base);
  });

  combinacoes.push(base + "777");
  combinacoes.push("Real" + base);

  return [...new Set(combinacoes)]
    .filter(nome => nome.length <= 40);
}

function gerar() {
  const entrada = document.getElementById("palavra");
  const estilo = document.getElementById("estilo").value;
  const resultado = document.getElementById("resultado");
  const mensagem = document.getElementById("mensagem");

  const palavra = entrada.value.trim();

  if (!palavra) {
    mensagem.textContent =
      "Digite uma palavra primeiro!";
    entrada.focus();
    return;
  }

  const nomes = misturar(criarNomes(palavra, estilo))
    .slice(0, 5);

  resultado.replaceChildren();

  const titulo = document.createElement("h3");
  titulo.textContent = "✨ Seus nomes:";
  resultado.appendChild(titulo);

  nomes.forEach(nome => {
    const linha = document.createElement("div");
    linha.className = "nome";

    const texto = document.createElement("span");
    texto.textContent = nome;

    const botao = document.createElement("button");
    botao.textContent = "📋 Copiar";
    botao.setAttribute("aria-label", "Copiar " + nome);

    botao.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(nome);
        mensagem.textContent = "Nome copiado: " + nome;
      } catch (erro) {
        mensagem.textContent =
          "Seu navegador não permitiu copiar automaticamente. " +
          "Selecione o nome: " + nome;
      }
    });

    linha.appendChild(texto);
    linha.appendChild(botao);
    resultado.appendChild(linha);
  });

  mensagem.textContent = "Pronto! Foram criados 5 nomes.";
}

document.getElementById("gerar")
  .addEventListener("click", gerar);

document.getElementById("palavra")
  .addEventListener("keydown", evento => {
    if (evento.key === "Enter") gerar();
  });
</script>
</body>
  </html>
