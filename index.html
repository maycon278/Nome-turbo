<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nome Turbo - Gerador de Nomes Criativos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif}
body{background:#0f0f12;color:white;padding:16px;min-height:100vh}
.container{max-width:500px;margin:0 auto}
.logo{text-align:center;margin:20px 0}
.logo h1{font-size:32px;background:linear-gradient(90deg,#8a5cf6,#f43f9e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo p{color:#aaa;margin-top:8px;font-size:14px}
.card{background:#1c1c20;border-radius:16px;padding:20px;margin:20px 0;border:1px solid #2a2a32}
label{color:#aaa;font-size:12px;font-weight:700;letter-spacing:1px;display:block;margin-bottom:8px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#121216;color:white;font-size:16px;outline:none}
input:focus{border-color:#8a5cf6}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.style-btn{padding:12px;border-radius:10px;border:1px solid #333;background:#121216;color:#ddd;cursor:pointer;font-weight:600}
.style-btn.ativo{background:#8a5cf6;border-color:#8a5cf6;color:white}
.btn-gerar{width:100%;padding:16px;background:linear-gradient(90deg,#8a5cf6,#f43f9e);border:none;border-radius:12px;color:white;font-size:18px;font-weight:800;margin-top:20px;cursor:pointer}
.resultado{margin-top:10px}
.nome-item{display:flex;justify-content:space-between;align-items:center;background:#121216;padding:12px 14px;border-radius:10px;margin-bottom:8px;border:1px solid #2a2a32}
.nome-item span{font-weight:600}
.btn-copy{background:#2a2a32;border:none;color:#8a5cf6;padding:6px 10px;border-radius:6px;font-weight:700;cursor:pointer}
.footer{text-align:center;color:#555;font-size:12px;margin:30px 0}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <h1>🚀 NOME TURBO</h1>
    <p>Crie nomes incríveis em segundos!</p>
  </div>

  <div class="card">
    <label>SEU NOME OU PALAVRA (OPCIONAL)</label>
    <input id="palavra" type="text" placeholder="Ex: Maycon, bola, tech...">
    
    <label style="margin-top:18px">ESCOLHA UM ESTILO</label>
    <div class="styles">
      <button class="style-btn ativo" onclick="escolher(this,'youtube')">📺 YouTube</button>
      <button class="style-btn" onclick="escolher(this,'tiktok')">🎵 TikTok</button>
      <button class="style-btn" onclick="escolher(this,'gamer')">🎮 Gamer</button>
      <button class="style-btn" onclick="escolher(this,'marca')">💼 Marca</button>
    </div>

    <button class="btn-gerar" onclick="gerar()">GERAR NOMES ⚡</button>
    
    <div id="lista" class="resultado"></div>
  </div>

  <div class="footer">Feito por Maycon | Projeto 100% gratuito e no celular<br>nometurbo.github.io</div>
</div>

<script>
let estiloAtual = 'youtube';
function escolher(botao, estilo){
  document.querySelectorAll('.style-btn').forEach(b=>b.classList.remove('ativo'));
  botao.classList.add('ativo');
  estiloAtual = estilo;
}

function gerar(){
  const palavra = document.getElementById('palavra').value.trim() || 'Turbo';
  const lista = document.getElementById('lista');
  lista.innerHTML = '';
  
  const bases = {
    youtube: ['Canal', 'Oficial', 'TV', 'Cast', 'Vlogs', 'Play', 'Prime', 'Top'],
    tiktok: ['Oficial', 'Vibe', 'Real', 'Loko', 'Turbo', 'Z', 'Mix', 'Flow'],
    gamer: ['Gamer', 'Pro', 'X', 'Kill', 'Squad', 'Elite', 'God', 'Ninja'],
    marca: ['Studio', 'Labs', 'Creative', 'Digital', 'Co', 'Makers', 'Hub', 'Brand']
  };
  
  const sufixos = bases[estiloAtual];
  let nomes = [];
  for(let i=0;i<12;i++){
    let p = palavra.charAt(0).toUpperCase() + palavra.slice(1);
    let s = sufixos[Math.floor(Math.random()*sufixos.length)];
    let num = Math.random() > 0.7 ? Math.floor(Math.random()*99) : '';
    let formato = Math.random();
    let nome = formato < 0.33 ? `${p} ${s}${num}` : formato < 0.66 ? `${p}${s}${num}` : `${s} ${p}${num}`;
    nomes.push(nome);
  }
  
  nomes.forEach(nome=>{
    const div = document.createElement('div');
    div.className = 'nome-item';
    div.innerHTML = `<span>${nome}</span><button class="btn-copy" onclick="copiar('${nome}', this)">Copiar</button>`;
    lista.appendChild(div);
  });
}

function copiar(texto, btn){
  navigator.clipboard.writeText(texto);
  btn.innerText = 'Copiado!';
  setTimeout(()=>btn.innerText='Copiar', 1500);
}
</script>
</body>
</html>
